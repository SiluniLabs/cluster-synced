apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-credentials
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  source:
    repoURL: https://github.com/SiluniLabs/cluster-synced.git
    targetRevision: main
    path: apps/arc-runners

  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
