apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-set
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.2

    helm:
      values: |
        githubConfigUrl: https://github.com/SiluniLabs
        githubConfigSecret: arc-github-app

        runnerScaleSetName: cluster-synced
        minRunners: 0
        maxRunners: 2

        containerMode:
          type: dind

  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
